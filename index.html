<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paula Batista</title>
<meta name="description" content="Links oficiais de Paula Batista: lista de espera, mentorias, palestras, Instagram e podcast.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..500&display=swap">
<style>
/* Layout: one centered column in the site's own rhythm. Photo first, name in Bodoni,
   four stacked link buttons, a two-photo strip, then social links. */
:root {
  --marfim: #F7F1E8;
  --linho: #EFE5D8;
  --areia: #E1D2BE;
  --cafe: #32241B;
  --cafe-md: #5B4736;
  --ouro: #B8873F;
  --ouro-texto: #8A6227;
  --tabaco: #3B2920;
  --blazer: #6E4E38;
  --ouro-claro: #E4C68E;
  --display: "Bodoni Moda", "Bodoni 72", Didot, "Times New Roman", serif;
  --texto: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --bg: #FFFFFF;
  --surface: var(--marfim);
  --fg: var(--blazer);
  --muted: var(--tabaco);
  --accent: var(--blazer);
  --line: var(--blazer);
  --btn-fill: var(--cafe);
  --btn-fg: var(--marfim);
  --teal: #073A42;
  --teal-dk: #042A30;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--texto);
  font-size: 16px;
  line-height: 1.55;
  padding-inline: 16px;
  min-height: 100vh;
}
img { display: block; max-width: 100%; height: auto; }
a { color: inherit; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.page {
  max-width: 460px;
  margin: 0 auto;
  padding-block: 36px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

/* Round photo, like the profile frame in the reference */
.portrait {
  margin: 0;
  width: min(176px, 52vw);
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 4px;
}
.portrait img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 54% 20%;
  border-radius: 50%;
}

.intro {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  text-align: center;
  min-width: 0;
}
.lead {
  margin: 0;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
}
h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 500;
  font-size: clamp(2.4rem, 11vw, 3rem);
  line-height: 1.05;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
.role {
  margin: 0;
  font-family: var(--display);
  font-style: italic;
  font-size: 18px;
  color: var(--muted);
  text-wrap: balance;
}

/* Link buttons */
.links {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
  list-style: none;
  margin: 0;
  padding: 0;
}
.bt {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  min-height: 56px;
  padding: 14px 20px;
  border: 1px solid var(--teal);
  background: var(--teal);
  color: var(--marfim);
  text-decoration: none;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.02em;
  transition: background-color 0.25s var(--ease, ease), color 0.25s ease;
}
.bt span:first-child { min-width: 0; overflow-wrap: anywhere; }
.bt .go {
  flex-shrink: 0;
  font-family: var(--display);
  font-size: 20px;
  color: var(--ouro-claro);
}
.bt:hover,
.bt:focus-visible {
  background: var(--teal-dk);
  border-color: var(--teal-dk);
  color: var(--marfim);
}
.bt:hover .go,
.bt:focus-visible .go { color: var(--ouro-claro); }

/* Photo strip */
.strip {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 0;
  width: 100%;
}
.strip figure {
  margin: 0;
  aspect-ratio: 4 / 5;
  overflow: hidden;
  background: var(--surface);
  min-width: 0;
}
.strip img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Quiet closing block */
.social {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px 24px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.social a {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  text-decoration: none;
  border-bottom: 1px solid transparent;
}
.social a:hover,
.social a:focus-visible {
  color: var(--accent);
  border-bottom-color: var(--accent);
  outline: none;
}
.foot {
  margin: 0;
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  letter-spacing: 0.04em;
}

.bt .thumb {
  width: 48px;
  height: 48px;
  flex-shrink: 0;
  object-fit: cover;
  border: 1px solid var(--ouro-claro);
}
.pair {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  list-style: none;
  margin: 0;
  padding: 0;
}
.pair .bt {
  flex-direction: column;
  justify-content: center;
  text-align: center;
  padding: 16px 10px;
  gap: 10px;
  min-height: 0;
}
.pair .bt .thumb { width: 100%; height: auto; aspect-ratio: 16 / 9; }
.pair .bt .go { display: none; }
.pair .bt {
  background: var(--blazer);
  border-color: var(--blazer);
  color: var(--marfim);
}
.pair .bt:hover,
.pair .bt:focus-visible {
  background: var(--tabaco);
  border-color: var(--tabaco);
  color: var(--marfim);
}
.pair .bt span:first-child {
  white-space: nowrap;
  font-size: 12px;
  letter-spacing: 0;
}
@media (max-width: 480px) {
  body { font-size: 17px; }
  .page { padding-block: 28px 32px; gap: 18px; }
  .portrait { width: min(200px, 60vw); }
  .lead { font-size: 14px; }
  h1 { font-size: 2.6rem; }
  .role { font-size: 19px; }
  .bt { min-height: 60px; font-size: 16px; padding: 14px 18px; }
  .bt .go { font-size: 22px; }
  .pair { gap: 10px; }
  .pair .bt { padding: 12px 8px; }
  .pair .bt span:first-child { white-space: normal; font-size: 14px; line-height: 1.3; }
  .social { gap: 10px 22px; }
  .social a { font-size: 13px; padding: 6px 0; }
  .foot { font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) {
  .bt { transition: none; }
}
</style>
